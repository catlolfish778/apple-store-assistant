[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-store-assistant"
version = "0.1.0"
description = "Local Apple Store availability monitor and manual checkout assistant"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "GPL-3.0-only"}
authors = [{name = "catlolfish778"}]

[project.scripts]
apple-store-assistant = "apple_store_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["apple_store_assistant*"]
