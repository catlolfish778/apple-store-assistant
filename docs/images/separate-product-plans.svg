<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">不同机型规格分别保存为商品计划</title>
  <desc id="desc">从官方商品页读取所有规格，选择唯一组合并核对型号编号；每种颜色和容量组合保存为单独计划。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8ff"/><stop offset="1" stop-color="#f9f7ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#25406b" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#92a7c7"/></marker>
  </defs>
  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>
  <text x="42" y="58" fill="#172b4d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700">一份商品计划，只对应一个准确规格组合</text>
  <text x="42" y="88" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15">同一机型的不同颜色 / 容量，也要分别确认并保存</text>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="40" y="130" width="240" height="200" rx="18" fill="#fff"/>
    <text x="64" y="168" fill="#3478f6" font-size="15" font-weight="700">步骤 1 · 读取官方目录</text>
    <text x="64" y="206" fill="#243b5a" font-size="17" font-weight="600">Apple 购买页</text>
    <text x="64" y="237" fill="#53657f" font-size="14">打开官网 → 读取规格</text>
    <text x="64" y="266" fill="#53657f" font-size="14">选择颜色、容量等全部选项</text>
    <rect x="62" y="286" width="194" height="27" rx="8" fill="#edf4ff"/>
    <text x="76" y="305" fill="#2462c5" font-size="13">预览唯一型号编号</text>
  </g>
  <path d="M292 230H338" stroke="#92a7c7" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="350" y="130" width="300" height="200" rx="18" fill="#fff"/>
    <text x="374" y="168" fill="#20a67a" font-size="15" font-weight="700">步骤 2 · 每种配置单独保存</text>
    <rect x="374" y="188" width="252" height="49" rx="10" fill="#f5f8fc"/>
    <circle cx="394" cy="212" r="8" fill="#404b5e"/>
    <text x="412" y="208" fill="#243b5a" font-size="14" font-weight="600">深色 · 256GB</text>
    <text x="412" y="226" fill="#718096" font-size="12">计划 A · 对应一个 part number</text>
    <rect x="374" y="248" width="252" height="49" rx="10" fill="#f5f8fc"/>
    <circle cx="394" cy="272" r="8" fill="#cdd3de"/>
    <text x="412" y="268" fill="#243b5a" font-size="14" font-weight="600">浅色 · 512GB</text>
    <text x="412" y="286" fill="#718096" font-size="12">计划 B · 对应另一个 part number</text>
  </g>
  <path d="M662 230H708" stroke="#92a7c7" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="720" y="130" width="440" height="200" rx="18" fill="#fff"/>
    <text x="744" y="168" fill="#8a60e8" font-size="15" font-weight="700">步骤 3 · 保存时选对按钮</text>
    <rect x="744" y="189" width="187" height="48" rx="10" fill="#edf4ff"/>
    <text x="766" y="219" fill="#2462c5" font-size="15" font-weight="700">保存计划</text>
    <text x="949" y="218" fill="#53657f" font-size="14">更新当前计划</text>
    <rect x="744" y="250" width="187" height="48" rx="10" fill="#f2edff"/>
    <text x="766" y="280" fill="#6945bd" font-size="15" font-weight="700">另存为</text>
    <text x="949" y="279" fill="#53657f" font-size="14">新增副本，保留旧计划</text>
  </g>
  <text x="42" y="370" fill="#9b3d4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="600">提示：计划名称只是备注；执行前仍要核对预览里的规格、价格和 part number。</text>
</svg>
