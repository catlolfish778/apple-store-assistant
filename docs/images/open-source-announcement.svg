<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" rx="28" fill="#f4f7fc"/>
<text x="60" y="85" font-family="-apple-system,PingFang SC,sans-serif" font-size="47" font-weight="700" fill="#172b4d">Apple Store Assistant 开源了</text>
<text x="60" y="137" font-family="-apple-system,PingFang SC,sans-serif" font-size="26" fill="#52657c">给准备买 iPhone 的 Mac 用户，多一个处理重复步骤的帮手</text>
<rect x="60" y="190" width="340" height="235" rx="22" fill="white"/>
<text x="86" y="242" font-family="-apple-system,PingFang SC,sans-serif" font-size="24" font-weight="700" fill="#3478f6">01</text>
<text x="86" y="289" font-family="-apple-system,PingFang SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">选准机型</text>
<text x="86" y="340" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">颜色、容量与型号编号</text>
<text x="86" y="377" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">每个规格组合单独建计划</text>
<rect x="430" y="190" width="340" height="235" rx="22" fill="white"/>
<text x="456" y="242" font-family="-apple-system,PingFang SC,sans-serif" font-size="24" font-weight="700" fill="#16a085">02</text>
<text x="456" y="289" font-family="-apple-system,PingFang SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">准备资料</text>
<text x="456" y="340" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">取货门店、联系人与发票</text>
<text x="456" y="377" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">选择支付宝或微信偏好</text>
<rect x="800" y="190" width="340" height="235" rx="22" fill="white"/>
<text x="826" y="242" font-family="-apple-system,PingFang SC,sans-serif" font-size="24" font-weight="700" fill="#7957dc">03</text>
<text x="826" y="289" font-family="-apple-system,PingFang SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">确认登录</text>
<text x="826" y="340" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">在专用浏览器登录 Apple</text>
<text x="826" y="377" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">验证码与身份验证由你处理</text>
<rect x="60" y="465" width="340" height="235" rx="22" fill="white"/>
<text x="86" y="517" font-family="-apple-system,PingFang SC,sans-serif" font-size="24" font-weight="700" fill="#3478f6">04</text>
<text x="86" y="564" font-family="-apple-system,PingFang SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">定时托管</text>
<text x="86" y="615" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">协助官网加购与结账步骤</text>
<text x="86" y="652" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">可选自动创建待付款订单</text>
<rect x="430" y="465" width="340" height="235" rx="22" fill="white"/>
<text x="456" y="517" font-family="-apple-system,PingFang SC,sans-serif" font-size="24" font-weight="700" fill="#16a085">05</text>
<text x="456" y="564" font-family="-apple-system,PingFang SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">核对并付款</text>
<text x="456" y="615" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">请亲自核对商品与最终门店</text>
<text x="456" y="652" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">实际付款由你自行完成</text>
<rect x="800" y="465" width="340" height="235" rx="22" fill="white"/>
<text x="826" y="517" font-family="-apple-system,PingFang SC,sans-serif" font-size="24" font-weight="700" fill="#7957dc">GPL</text>
<text x="826" y="564" font-family="-apple-system,PingFang SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">源码公开</text>
<text x="826" y="615" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">代码、构建步骤与图文教程</text>
<text x="826" y="652" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">欢迎反馈、贡献与自愿打赏</text>
<text x="60" y="770" font-family="-apple-system,PingFang SC,sans-serif" font-size="24" font-weight="600" fill="#172b4d">流程示意，非实测录屏</text>
<text x="60" y="811" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" fill="#52657c">实验版 · 真实开售完整链路尚未验证 · 不锁库存，不保证抢到</text>
<text x="60" y="852" font-family="-apple-system,PingFang SC,sans-serif" font-size="21" fill="#52657c">github.com/catlolfish778/apple-store-assistant  ·  X @catlolfish778</text>
</svg>